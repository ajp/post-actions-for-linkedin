<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Post Actions for LinkedIn — Options</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1d2226;
        --muted: #56687a;
        --accent: #0a66c2;
        --card: #ffffff;
        --bg: #f4f2ee;
        --border: #d0d5da;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e9e5df;
          --muted: #9aa8b5;
          --accent: #70b5f9;
          --card: #1b1f23;
          --bg: #121417;
          --border: #38434f;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 14px;
        min-width: 340px;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      main {
        max-width: 460px;
        margin: 0 auto;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
      }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p.sub { margin: 0 0 20px; color: var(--muted); }
      fieldset { border: 0; margin: 0; padding: 0; }
      legend { font-weight: 600; margin-bottom: 10px; padding: 0; }
      label.opt {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 10px;
        cursor: pointer;
      }
      label.opt:hover { border-color: var(--accent); }
      label.opt input { margin-top: 2px; accent-color: var(--accent); }
      .opt .title { font-weight: 600; }
      .opt .desc { color: var(--muted); font-size: 13px; }
      .hint {
        color: var(--muted);
        font-size: 13px;
        margin: 16px 0 0;
      }
      #status {
        color: var(--accent);
        font-size: 13px;
        height: 18px;
        margin: 12px 0 0;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Post Actions for LinkedIn</h1>
      <p class="sub">Choose what happens when you click the open-in-new-tab icon on a post.</p>
      <fieldset>
        <legend>Open the post in…</legend>
        <label class="opt">
          <input type="radio" name="openMode" value="background" />
          <span>
            <span class="title">A background tab</span><br />
            <span class="desc">Stay on your feed; the post opens behind it. (Default)</span>
          </span>
        </label>
        <label class="opt">
          <input type="radio" name="openMode" value="foreground" />
          <span>
            <span class="title">A foreground tab</span><br />
            <span class="desc">Switch to the post's tab immediately.</span>
          </span>
        </label>
      </fieldset>
      <p class="hint">Tip: hold <strong>⌘</strong> (macOS) or <strong>Ctrl</strong> while clicking to do the opposite, just for that click.</p>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
